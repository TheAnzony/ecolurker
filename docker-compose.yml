name: ecolurker

services:
  bot:
    build: .
    image: ecolurker:latest
    container_name: ecolurker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sin esto el contenedor corre en UTC y las estadisticas por franja
      # horaria, dia y mes saldrian desplazadas 1-2h respecto a la hora real
      # en España. Europe/Madrid gestiona solo el cambio de hora.
      - TZ=Europe/Madrid
    volumes:
      - ./data:/app/data
    ports:
      # Publicado SOLO en el localhost del host: el panel no queda accesible
      # desde la red. Quitar el "127.0.0.1:" lo expondria a internet, y el
      # panel no tiene autenticacion.
      - "127.0.0.1:3000:3000"
